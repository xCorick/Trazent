# Aplica las migraciones y funciones pendientes en la base de Neon al fusionar a main.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   NEON_PGHOST, NEON_PGUSER, NEON_PGPASSWORD, NEON_PGDATABASE
name: DB deploy

on:
  push:
    branches: [main]
    paths: ['db/migrations/**', 'db/functions/**']
  workflow_dispatch:

# Nunca dos despliegues de base de datos al mismo tiempo.
concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: db
    env:
      PGHOST: ${{ secrets.NEON_PGHOST }}
      PGPORT: 5432
      PGUSER: ${{ secrets.NEON_PGUSER }}
      PGPASSWORD: ${{ secrets.NEON_PGPASSWORD }}
      PGDATABASE: ${{ secrets.NEON_PGDATABASE }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar pendientes en Neon
        run: bash scripts/apply-pending.sh
