# Configuración de Yarn 4 (Berry) para Trazent.

# Carpeta node_modules tradicional: compatible con Vite, ESLint y, más adelante, Expo / React Native.
nodeLinker: node-modules

# Seguridad de la cadena de suministro:
# - No se ejecutan los scripts de instalación de las dependencias, salvo las que se
#   permitan en "dependenciesMeta" del package.json raíz (por ahora solo esbuild, que usa Vite).
# - Yarn 4 además espera unos días antes de instalar versiones recién publicadas
#   (npmMinimalAgeGate); ver https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
enableScripts: false

enableTelemetry: false
